image:
  size: [224, 224]
  color_mode: RGB
  interpolation: bilinear
  preserve_aspect_ratio: false
  normalization: imagenet
normalization:
  enabled: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
augmentation:
  enabled_for: train_only
  probability: 0.0
  horizontal_flip: false
  rotation_degrees: 0.0
  validation: false
  test: false
split:
  strategy: stratified
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  duplicate_group_protection: true
  cross_class_duplicate_policy: exclude_conflicted_groups
  patient_grouping_available: false
class_mapping:
  Normal: 0
  Benign: 1
  Malignant: 2

experiments:
  strategies: [clean_baseline, corruption_aware]
  architectures: [mobilenet_v3_large, efficientnet_b0, resnet18]
  total_configurations: 6
training:
  batch_size: 32
  max_epochs: 20
  num_workers: 0
  pin_memory: true
  mixed_precision: true
  precision_mode: amp_fp16
  optimizer:
    name: adamw
    learning_rate: 0.0001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
    eps: 0.00000001
  loss:
    name: cross_entropy
    class_weighted: false
  scheduler:
    name: reduce_on_plateau
    mode: max
    factor: 0.5
    patience: 2
    min_lr: 0.000001
  early_stopping: true
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0001
  monitor: val_macro_f1
checkpoint:
  save_best: true
  save_last: true
  resume_enabled: true
experiment:
  output_directory: experiments
